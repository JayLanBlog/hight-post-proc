<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图形学知识体系 · 设计文档预览</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; }
  #sidebar { position: fixed; left: 0; top: 0; width: 260px; height: 100vh; background: #16213e; padding: 20px; overflow-y: auto; border-right: 1px solid #0f3460; }
  #sidebar h2 { color: #e94560; font-size: 16px; margin-bottom: 16px; }
  #sidebar a { display: block; color: #a0a0c0; text-decoration: none; padding: 8px 12px; margin: 4px 0; border-radius: 6px; font-size: 14px; transition: all 0.2s; }
  #sidebar a:hover, #sidebar a.active { background: #0f3460; color: #e94560; }
  #content { margin-left: 260px; padding: 30px 40px; max-width: 960px; }
  #content h1 { color: #e94560; font-size: 28px; margin-bottom: 8px; border-bottom: 2px solid #0f3460; padding-bottom: 12px; }
  #content h2 { color: #ff6b6b; font-size: 22px; margin: 28px 0 12px; }
  #content h3 { color: #f0c040; font-size: 18px; margin: 20px 0 8px; }
  #content h4 { color: #4ecdc4; font-size: 16px; margin: 16px 0 6px; }
  #content p { line-height: 1.7; margin: 8px 0; }
  #content code { background: #0f3460; padding: 2px 6px; border-radius: 3px; font-size: 13px; color: #f0c040; }
  #content pre { background: #0d1b2a; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; border: 1px solid #0f3460; }
  #content pre code { background: none; padding: 0; font-size: 13px; color: #a0d0a0; }
  #content table { border-collapse: collapse; width: 100%; margin: 12px 0; }
  #content th, #content td { border: 1px solid #0f3460; padding: 8px 14px; text-align: left; font-size: 14px; }
  #content th { background: #0f3460; color: #f0c040; }
  #content blockquote { border-left: 4px solid #e94560; padding: 8px 16px; margin: 12px 0; background: rgba(233,69,96,0.08); border-radius: 0 6px 6px 0; }
  #content blockquote p { margin: 4px 0; }
  #content a { color: #4ecdc4; }
  #content hr { border: none; border-top: 1px solid #0f3460; margin: 24px 0; }
  #content ul, #content ol { padding-left: 24px; margin: 8px 0; }
  #content li { line-height: 1.6; margin: 2px 0; }
  .loading { color: #666; font-style: italic; padding: 40px; text-align: center; }
</style>
</head>
<body>
<div id="sidebar">
  <h2>📖 图形学知识体系</h2>
  <a href="#" onclick="loadDoc('graphics-programming-handbook.md')" class="active">📋 总索引</a>
  <a href="#" onclick="loadDoc('part1-foundation.md')">🟢 Part 1 · 基础入门</a>
  <a href="#" onclick="loadDoc('part2-advanced.md')">🟡 Part 2 · 高级渲染</a>
  <a href="#" onclick="loadDoc('part3-commercial.md')">🔴 Part 3 · 商业级别</a>
  <a href="#" onclick="loadDoc('part4-frontier.md')">💎 Part 4 · 前沿发展</a>
  <hr style="border-color:#0f3460;margin:16px 0;">
  <a href="#" onclick="loadDoc('optimization-spec.md')" style="font-size:12px">📝 优化规格</a>
  <a href="#" onclick="loadDoc('implementation-plan.md')" style="font-size:12px">📝 实施计划</a>
</div>
<div id="content">
  <div class="loading">加载中...</div>
</div>
<script>
let cache = {};
async function loadDoc(name) {
  document.querySelectorAll('#sidebar a').forEach(a => a.classList.remove('active'));
  event.target.classList.add('active');
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">加载中...</div>';
  
  try {
    if (!cache[name]) {
      const resp = await fetch(name);
      cache[name] = await resp.text();
    }
    content.innerHTML = marked.parse(cache[name]);
    // highlight code blocks
    content.querySelectorAll('pre code').forEach(b => {
      b.parentElement.style.background = '#0d1b2a';
    });
  } catch(e) {
    content.innerHTML = `<div class="loading">加载失败: ${e.message}</div>`;
  }
}
loadDoc('graphics-programming-handbook.md');
</script>
</body>
</html>
